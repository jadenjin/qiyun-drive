name: qiyun-drive

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    build:
      context: ./backend
    command: ["pan-api"]
    restart: unless-stopped
    environment: &backend_environment
      ADDR: :8080
      DATABASE_URL: postgres://pan:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pan?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      ALLOWED_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-panminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: pan-objects
      PRESIGN_TTL: 15m
      UPLOAD_TTL: 24h
      TRASH_RETENTION: 720h
    depends_on:
      postgres:
        condition: service_healthy
      minio-ready:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build:
      context: ./backend
    command: ["pan-worker"]
    restart: unless-stopped
    environment: *backend_environment
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_DB: pan
      POSTGRES_USER: pan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pan -d pan"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-07-23T15-54-02Z}
    command: server /data --console-address :9001
    restart: unless-stopped
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-panminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost}
    volumes:
      - minio_data:/data

  minio-ready:
    image: busybox:1.37.0
    restart: "no"
    command: ["sh", "-ec", "timeout 120 sh -c 'until wget -q -O /dev/null http://minio:9000/minio/health/ready; do sleep 2; done'"]
    depends_on:
      minio:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  caddy_data:
