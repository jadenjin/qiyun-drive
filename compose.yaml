name: qiyun-drive

x-logging: &default_logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    mem_limit: 128m
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    image: qiyun-drive-caddy:2.11.4
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864
      - /config:rw,noexec,nosuid,nodev,size=16777216,uid=10002,gid=10002,mode=0750
    logging: *default_logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_v2:/data
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    mem_limit: 384m
    build:
      context: .
      target: web
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,uid=1000,gid=1000,mode=0700
    logging: *default_logging
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    mem_limit: 384m
    build:
      context: ./backend
    command: ["pan-api"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    logging: *default_logging
    volumes:
      - ./ops:/var/lib/qiyun-ops:ro
    environment: &backend_environment
      ADDR: :8080
      DATABASE_URL: postgres://pan:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pan?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      ALLOWED_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      TRUST_PROXY: "true"
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-qiyun}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      S3_BUCKET: pan-objects
      PRESIGN_TTL: 15m
      UPLOAD_TTL: 24h
      TRASH_RETENTION: 720h
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build:
      context: ./backend
    command: ["pan-worker"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=536870912
    logging: *default_logging
    environment: *backend_environment
    depends_on:
      api:
        condition: service_healthy

  postgres:
    mem_limit: 384m
    build:
      context: .
      dockerfile: deploy/Dockerfile.postgres
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:17.11-alpine}
    image: qiyun-drive-postgres:17.11-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging: *default_logging
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_DB: pan
      POSTGRES_USER: pan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16777216,uid=70,gid=70,mode=3777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pan -d pan"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    mem_limit: 512m
    build:
      context: .
      dockerfile: deploy/Dockerfile.rustfs
      args:
        RUSTFS_IMAGE: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.0-rc.2}
    image: qiyun-drive-rustfs:${RUSTFS_VERSION:-1.0.0-rc.2}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging: *default_logging
    ports:
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-qiyun}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - rustfs_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864
      - /logs:rw,noexec,nosuid,nodev,size=67108864,uid=10001,gid=10001,mode=0750
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  rustfs_data:
  caddy_data_v2:
